services:
  # ==========================================
  # Database Service: PostgreSQL 16
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: promotions_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-promotions_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-promotions_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - promotions_network

  # ==========================================
  # Backend Service: Node.js (Hot Reload with tsx)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: promotions_backend_dev
    restart: unless-stopped
    environment:
      PORT: 8000
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-promotions_db}?schema=public
      CORS_ORIGIN: "*"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - promotions_network

  # ==========================================
  # Frontend Service: React (Vite HMR Live Reload)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: promotions_frontend_dev
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - promotions_network

# ==========================================
# Volumes & Networks Definitions
# ==========================================
volumes:
  postgres_data:
    driver: local

networks:
  promotions_network:
    driver: bridge
